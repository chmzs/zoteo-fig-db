[project]
name = "zoteo-fig-db"
version = "0.2.0"
description = "把本地 Zotero 文库的 PDF 图表建成可语义检索的图库（granite-97m INT8 + FTS5）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "见 LICENSE" }
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
# MCP 服务（mcp_server.py，端口 23122）只在需要 Agent 接入时安装
mcp = ["mcp>=1.0"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["cache", "batch_tmp", "models", "static"]

[tool.ruff.lint]
# 只开能抓真问题的规则：未用变量/导入、重复键、未定义名、语法级错误
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
